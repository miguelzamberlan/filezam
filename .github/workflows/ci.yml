name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reaproveitado pelo release.yml antes de publicar uma versão

permissions:
  contents: read

jobs:
  web:
    name: Frontend (tsc + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --omit=dev
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: internal/server/webdist/dist
          retention-days: 1

  go:
    name: Backend (vet + test + govulncheck)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: webdist
          path: internal/server/webdist/dist
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/filezam
        env:
          CGO_ENABLED: "0"
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: filezam:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
